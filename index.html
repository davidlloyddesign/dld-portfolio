<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>David Lloyd Design — Red & Black</title>
<meta name="description" content="David Lloyd Design — information and report design for United Nations agencies, governments, universities and NGOs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#1a1818;
    --card:#242020;
    --ink:#F5F1E6;
    --red:#ED1C24;
    --red-deep:#B8151B;
    --highlight:#F5F1E6;
    --muted:rgba(245,241,230,0.62);
    --line:rgba(245,241,230,0.18);
    --shadow:0 20px 44px rgba(0,0,0,0.5);
    --sidebar-w:264px;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%; scroll-behavior:smooth; overflow-x:clip;}
  body{
    margin:0;
    overflow-x:clip;
    background:var(--paper);
    color:var(--ink);
    font-family:"Roboto", ui-sans-serif, system-ui, sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--red); color:#fff; }
  a{ color:inherit; }
  img{ max-width:100%; }
  .display{ font-family:"Roboto", sans-serif; font-weight:800; letter-spacing:-0.01em; margin:0; }
  .wrap{ max-width:1240px; margin:0 auto; padding:0 28px; }

  .eyebrow{
    display:inline-flex; align-items:center; gap:9px;
    font-family:"Roboto"; font-size:12px; letter-spacing:0.14em; font-weight:700;
    color:var(--highlight);
  }
  .eyebrow::before{ content:''; width:20px; height:2px; background:var(--highlight); display:inline-block; }

  [contenteditable="true"]{ outline:1.5px dashed currentColor; outline-offset:4px; border-radius:1px; }
  [contenteditable="true"]:focus{ outline:2px solid var(--red); background:rgba(245,241,230,0.12); }

  /* reveal */
  .reveal{ opacity:0; transform:translateY(22px); transition:opacity .6s cubic-bezier(.22,.8,.24,1), transform .6s cubic-bezier(.22,.8,.24,1); }
  .reveal.in{ opacity:1; transform:translateY(0); }
  @media (prefers-reduced-motion: reduce){ .reveal{ opacity:1 !important; transform:none !important; transition:none !important; } }

  /* nav */
  .nav{ position:sticky; top:0; z-index:30; background:rgba(11,10,8,0.9); backdrop-filter:blur(10px); border-bottom:1px solid rgba(245,241,230,0.14); }
  .nav-row{ display:flex; align-items:center; justify-content:space-between; height:74px; }
  .wordmark{ display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--highlight); }
  .wordmark img.logo-img{ height:32px; width:auto; display:block; }
  .wordmark .full{ font-size:12px; letter-spacing:0.1em; font-weight:700; color:var(--highlight); opacity:0.9; }
  .side-wordmark{ display:flex; flex-direction:column; align-items:flex-start; gap:14px; text-decoration:none; color:var(--highlight); }
  .side-wordmark img.logo-img{ height:48px; width:auto; display:block; filter:drop-shadow(0 1px 6px rgba(0,0,0,0.6)); }
  .side-wordmark .full{ font-size:13px; font-weight:700; letter-spacing:0.02em; text-shadow:0 1px 6px rgba(0,0,0,0.6); }
  .nav-links{ display:flex; align-items:center; gap:30px; }
  .nav-links a{ font-size:13.5px; font-weight:600; text-decoration:none; color:var(--highlight); opacity:0.75; }
  .nav-links a:hover{ opacity:1; color:var(--red); }
  @media (max-width:640px){ .nav-links a.hide-sm{ display:none; } }
  .btn-edit-tab{ font-family:"Roboto"; font-weight:700; font-size:12px; letter-spacing:0.04em; background:var(--highlight); color:#0B0A08; border:0; padding:9px 16px; cursor:pointer; border-radius:6px; }
  .btn-edit-tab:hover{ background:#fff; }

  /* persistent left-hand menu — no background colour at all, text floats directly on the page/image with a soft shadow for legibility */
  .sidebar{ position:fixed; top:0; left:0; bottom:0; width:var(--sidebar-w); background:none; display:flex; flex-direction:column; padding:32px 26px; z-index:40; overflow-y:auto; }
  .sidebar-bar{ display:flex; align-items:center; justify-content:space-between; }
  .side-toggle{ display:none; background:none; border:0; color:var(--highlight); font-size:22px; line-height:1; cursor:pointer; padding:4px; filter:drop-shadow(0 1px 5px rgba(0,0,0,0.55)); }
  .side-menu{ display:contents; }
  .side-nav{ display:flex; flex-direction:column; gap:1px; margin-top:56px; }
  .side-link{ font-family:"Roboto"; font-size:21px; font-weight:400; letter-spacing:-0.01em; color:rgba(245,241,230,0.68); text-decoration:none; padding:4.5px 0; transition:color .15s ease, filter .12s ease, opacity .12s ease; text-shadow:0 1px 6px rgba(0,0,0,0.6); }
  .side-link:hover{ color:var(--highlight); }
  .side-link.active{ color:var(--highlight); }
  /* on rollover, the hovered item stays sharp while its siblings soften out of focus */
  .side-nav:hover .side-link:not(:hover){ filter:blur(1.5px); opacity:0.55; }
  @media (prefers-reduced-motion:reduce){
    .side-nav:hover .side-link:not(:hover){ filter:none; opacity:0.68; }
  }
  .side-foot{ margin-top:auto; display:flex; flex-direction:column; align-items:flex-start; gap:14px; padding-top:24px; border-top:1px solid rgba(245,241,230,0.3); }
  .side-email{ font-size:12px; color:var(--highlight); text-decoration:none; word-break:break-all; text-shadow:0 1px 6px rgba(0,0,0,0.6); }
  .side-email:hover{ opacity:0.75; }

  .page-main{ margin-left:var(--sidebar-w); min-height:100vh; display:flex; flex-direction:column; }
  .page-section{ padding-top:32px; flex:1 0 auto; }
  /* lets any page-section's own background bleed full-width behind the transparent sidebar, same as .hero-page */
  .page-section{ margin-left:calc(-1 * var(--sidebar-w)); width:calc(100% + var(--sidebar-w)); padding-left:var(--sidebar-w); box-sizing:border-box; }
  .contact-page .colophon{ margin-top:0; }
  .contact-page .colophon .wrap{ padding-top:32px; }
  /* hero bleeds full-width behind the transparent sidebar; its own content stays inset by the sidebar width */
  .hero-page{ min-height:92vh; margin-left:calc(-1 * var(--sidebar-w)); width:calc(100% + var(--sidebar-w)); padding-left:var(--sidebar-w); }

  @media (max-width:900px){
    .sidebar{ width:100%; height:auto; bottom:auto; padding:14px 22px; background:none; }
    .side-wordmark{ flex-direction:row; align-items:center; gap:10px; }
    .side-wordmark img.logo-img{ height:32px; }
    .side-wordmark .full{ font-size:13px; }
    .side-toggle{ display:block; }
    .side-menu{ display:block; position:fixed; inset:0; top:64px; background:var(--paper); padding:20px 28px 28px; transform:translateY(-12px); opacity:0; pointer-events:none; transition:transform .25s ease, opacity .25s ease; overflow-y:auto; z-index:39; }
    .side-menu.open{ transform:translateY(0); opacity:1; pointer-events:auto; }
    .side-nav{ margin-top:8px; }
    .side-link{ font-size:26px; }
    .page-main{ margin-left:0; padding-top:64px; }
    .hero-page{ margin-left:0; width:100%; padding-left:0; }
    .page-section{ margin-left:0; width:100%; padding-left:0; }
  }

  /* hero — full-bleed, Tomato-inspired minimal landing */
  .hero{ position:relative; overflow:hidden; }
  .hero-tomato{ position:relative; min-height:92vh; display:flex; }
  .hero-tomato-bg{ position:absolute; inset:0; z-index:0; overflow:hidden; background:#000; }
  .hero-tomato-bg img, .hero-tomato-bg video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 25%; display:block; opacity:0.85; }
  .hero-tomato-bg .ken-burns{ animation:kenBurns 32s ease-in-out infinite alternate; transform-origin:50% 50%; will-change:transform; }
  @keyframes kenBurns{
    0%{ transform:scale(1); }
    100%{ transform:scale(1.035); }
  }
  @media (prefers-reduced-motion:reduce){
    .hero-tomato-bg .ken-burns{ animation:none !important; }
  }
  .hero-slideshow{ position:absolute; inset:0; width:100%; height:100%; }
  .hero-slideshow .hero-slide{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 25%; display:block; opacity:0; will-change:opacity, transform; animation-name:heroSlideFade; animation-timing-function:ease-in-out; animation-iteration-count:infinite; transform-origin:50% 50%; }
  /* 5-slide crossfade: each slide occupies an equal 20% segment of the shared cycle, staggered via animation-delay */
  @keyframes heroSlideFade{
    0%{ opacity:0; transform:scale(1); }
    3%{ opacity:0.85; }
    17%{ opacity:0.85; transform:scale(1.045); }
    20%{ opacity:0; transform:scale(1.045); }
    100%{ opacity:0; }
  }
  @media (prefers-reduced-motion:reduce){
    .hero-slideshow .hero-slide{ animation:none !important; opacity:0; }
    .hero-slideshow .hero-slide:first-child{ opacity:0.85; }
  }
  .hero-tomato-veil{ position:absolute; inset:0; z-index:1; background:linear-gradient(180deg, rgba(11,10,8,0.72) 0%, rgba(11,10,8,0.18) 26%, rgba(11,10,8,0.12) 58%, rgba(11,10,8,0.88) 100%); }
  @media (max-width:900px){
    .hero-tomato-veil{ background:linear-gradient(180deg, rgba(11,10,8,0.94) 0%, rgba(11,10,8,0.8) 34%, rgba(11,10,8,0.2) 58%, rgba(11,10,8,0.92) 100%); }
    .hero-tomato-h1, .hero-tomato .eyebrow, .hero-tomato-sub{ text-shadow:0 2px 10px rgba(0,0,0,0.7); }
  }
  .hero-tomato-content{ position:relative; z-index:2; width:100%; min-height:100%; padding:52px 0 48px; display:flex; flex-direction:column; justify-content:space-between; gap:32px; }
  .hero-tomato-top{ max-width:620px; }
  .hero-tomato .eyebrow{ color:var(--highlight); }
  .hero-tomato-h1{ color:var(--highlight); font-size:clamp(25px,4.6vw,70px); line-height:1; font-weight:800; margin-top:18px; }
  .hero-tomato-sub{ margin-top:20px; max-width:56ch; font-size:17.5px; line-height:1.6; color:rgba(245,241,230,0.8); }
  .hero-tomato-bottom{ display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:24px 40px; border-top:1px solid rgba(245,241,230,0.22); padding-top:22px; }
  .hero-tomato-bottom-left{ display:flex; flex-direction:column; gap:16px; max-width:560px; flex:1 1 360px; }
  .hero-testimonial{ display:flex; flex-direction:column; gap:8px; }
  .hero-testimonial-body{ display:flex; align-items:flex-start; gap:10px; }
  .hero-testimonial-quote{ margin:0; font-size:14px; line-height:1.6; font-style:italic; color:rgba(245,241,230,0.82); }
  .hero-testimonial-quote::before{ content:'“'; }
  .hero-testimonial-quote::after{ content:'”'; }
  .hero-testimonial-quote.testi-clamped{ display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .testi-expand-btn{ flex:0 0 auto; width:20px; height:20px; margin-top:2px; border-radius:50%; border:1px solid rgba(245,241,230,0.4); background:transparent; color:rgba(245,241,230,0.9); font-size:13px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .2s ease, transform .2s ease; }
  .testi-expand-btn:hover{ background:rgba(245,241,230,0.15); }
  .testi-expand-btn.is-expanded{ transform:rotate(135deg); }
  .hero-testimonial-foot{ font-size:12px; }
  .hero-testimonial-name{ font-weight:700; color:var(--highlight); }
  .hero-testimonial-role{ color:rgba(245,241,230,0.6); margin-left:6px; }
  .hero-testimonial-nav{ display:flex; align-items:center; gap:10px; }
  .testi-arrow{ background:none; border:none; padding:2px 2px; color:rgba(245,241,230,0.75); font-size:14px; line-height:1; cursor:pointer; }
  .testi-arrow:hover{ color:#fff; }
  .hero-testimonial-dots{ display:flex; align-items:center; gap:6px; }
  .testi-dot{ width:6px; height:6px; border-radius:50%; background:rgba(245,241,230,0.32); display:inline-block; }
  .testi-dot.active{ background:var(--highlight); }
  @media (max-width:620px){ .hero-tomato-bottom-left{ max-width:none; } }
  .hero-tomato-meta{ display:flex; flex-direction:column; align-items:flex-start; gap:14px; }
  .hero-categories{ display:flex; flex-wrap:wrap; margin-top:22px; }
  .hero-cat{ font-family:"Roboto"; background:none; border:0; border-right:1px solid rgba(245,241,230,0.25); cursor:pointer; color:rgba(245,241,230,0.75); font-size:13.5px; font-weight:600; padding:0 18px 0 0; margin-right:18px; line-height:1; }
  .hero-cat:last-child{ border-right:0; margin-right:0; padding-right:0; }
  .hero-cat:hover{ color:var(--highlight); }
  .hero-cta{ display:inline-flex; align-items:center; gap:8px; width:fit-content; border-bottom:2px solid var(--highlight); padding-bottom:6px; font-size:15px; font-weight:700; text-decoration:none; color:var(--highlight); }
  .hero-cta:hover{ color:#fff; }
  .hero-regions{ font-size:11px; letter-spacing:0.06em; font-weight:600; color:rgba(245,241,230,0.6); }
  @media (max-width:700px){
    /* below tablet width the photo can't give the headline enough clear space to sit over,
       so the hero stacks: a solid-background text panel, then the photo as its own banner beneath */
    .hero-tomato{ display:block; min-height:auto; }
    .hero-tomato-bg{ position:relative; inset:auto; height:48vh; min-height:260px; max-height:420px; }
    .hero-tomato-veil{ display:none; }
    .hero-tomato-content{ position:static; min-height:0; width:auto; background:var(--paper); padding:36px 28px 34px; gap:28px; }
    .hero-tomato-h1, .hero-tomato .eyebrow, .hero-tomato-sub{ text-shadow:none; }
    .hero-tomato-bottom{ flex-direction:column; align-items:flex-start; }
    .hero-categories{ flex-direction:column; gap:2px; width:100%; }
    .hero-cat{ padding:8px 0; margin-right:0; border-right:0; border-bottom:1px solid rgba(245,241,230,0.16); width:100%; text-align:left; }
    .hero-cat:last-child{ border-bottom:0; }
  }

  section{ padding:0; }
  .section-head{ padding:88px 0 10px; }
  .section-head h2{ font-size:clamp(28px,4vw,46px); margin-top:14px; }
  /* routed pages already get their top clearance from .page-section — this legacy 88px is only
     needed for the stacked sections of the single-scroll edit-mode page, so it's zeroed here */
  .page-section .section-head{ padding-top:0; }

  /* work — grid */
  #work{ padding-bottom:20px; }
  /* grey background + dark text, scoped to the routed Work page only (not the legacy edit-mode grid, which shares id="work") */
  .page-section#work{
    background:#929598;
    padding-top:32px;
    padding-bottom:clamp(80px, 14vh, 200px);
    min-height:100vh;
    --ink:#232323;
    --highlight:#1a1818;
    --muted:rgba(26,24,24,0.68);
    --line:rgba(26,24,24,0.18);
  }
  .page-section#work .display,
  .page-section#work h1,
  .page-section#work h2,
  .page-section#work h3{ color:var(--highlight); }
  .page-section#work .filter-chip{ border-color:rgba(26,24,24,0.35); }
  .page-section#work .filter-chip:hover{ border-color:var(--red); }
  .page-section#work .filter-chip.active{ color:#F5F1E6; }
  .page-section#work .tomato-row{ border-top-color:rgba(26,24,24,0.16); }
  .page-section#work .tomato-thumb{ border-color:rgba(26,24,24,0.2); background:rgba(26,24,24,0.06); }
  .work-filters{ display:flex; flex-wrap:wrap; gap:10px; margin-top:28px; }
  .filter-chip{ font-family:"Roboto"; font-weight:600; font-size:13px; padding:9px 18px; border-radius:20px; border:1.5px solid rgba(245,241,230,0.4); background:transparent; color:var(--ink); cursor:pointer; }
  .filter-chip:hover{ border-color:var(--highlight); color:var(--ink); }
  .filter-chip.active{ background:var(--red); border-color:var(--red); color:var(--highlight); }

  .work-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:44px 32px; margin-top:48px; }
  @media (max-width:980px){ .work-grid{ grid-template-columns:repeat(2,1fr); gap:36px 24px; } }
  @media (max-width:620px){ .work-grid{ grid-template-columns:1fr; } }
  .work-card{ display:flex; flex-direction:column; }
  .work-card[hidden]{ display:none; }
  .work-card-link{ display:flex; flex-direction:column; color:inherit; text-decoration:none; }
  .work-card-link:hover .work-card-title{ text-decoration:underline; }
  .work-card-media{ aspect-ratio:4/5; border-radius:10px; overflow:hidden; background:var(--card); border:1px solid rgba(245,241,230,0.3); }
  .work-card-media img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .45s ease; }
  .work-card:hover .work-card-media img{ transform:scale(1.045); }
  .img-placeholder{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; color:rgba(245,241,230,0.5); font-size:12px; letter-spacing:0.04em; }
  .work-card-meta{ margin-top:18px; font-size:12px; letter-spacing:0.05em; font-weight:700; color:var(--highlight); display:block; }
  .work-card-title{ font-size:23px; margin-top:6px; font-weight:800; line-height:1.08; }
  .work-card-desc{ margin-top:10px; font-size:14.5px; line-height:1.58; color:var(--muted); }
  .work-card-tags{ display:flex; flex-wrap:wrap; gap:7px; margin-top:14px; }
  .work-card-price{ display:flex; align-items:center; justify-content:space-between; gap:14px; margin-top:16px; padding-top:14px; border-top:1px dashed rgba(245,241,230,0.4); }
  .price-tag{ font-weight:800; font-size:13.5px; color:var(--highlight); background:var(--red); padding:6px 13px; border-radius:20px; }

  /* work — Tomato-style thumbnail rows (routed Work page only; legacy edit-mode grid above is untouched) */
  .tomato-list{ margin-top:48px; display:flex; flex-direction:column; }
  .tomato-row{ padding:34px 0; border-top:1px solid rgba(245,241,230,0.16); }
  .tomato-row:first-child{ border-top:0; padding-top:0; }
  .tomato-row[hidden]{ display:none; }
  .tomato-row-head{ display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:6px 20px; }
  .tomato-row-title-link{ text-decoration:none; color:inherit; }
  .tomato-row-title-link:hover .tomato-row-title{ text-decoration:underline; }
  .tomato-row-title{ font-family:"Roboto"; font-size:14px; font-weight:800; letter-spacing:0.02em; color:var(--ink); margin:0; }
  .tomato-row-meta{ font-size:12px; color:var(--muted); letter-spacing:0.02em; }
  .tomato-thumbs{ display:flex; gap:10px; margin-top:20px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:6px; scrollbar-width:none; -ms-overflow-style:none; cursor:url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgdmlld0JveD0iMCAwIDQwIDQwIj4KPGNpcmNsZSBjeD0iMjAiIGN5PSIyMCIgcj0iMTgiIGZpbGw9IiNFRDFDMjQiIHN0cm9rZT0iI0Y1RjFFNiIgc3Ryb2tlLXdpZHRoPSIyIi8+CjxwYXRoIGQ9Ik0xMiAyMGgxNk0xMiAyMGw1LTVNMTIgMjBsNSA1TTI4IDIwbC01LTVNMjggMjBsLTUgNSIgc3Ryb2tlPSIjRjVGMUU2IiBzdHJva2Utd2lkdGg9IjIuNCIgZmlsbD0ibm9uZSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+Cjwvc3ZnPg==') 20 20, grab; user-select:none; }
  .tomato-thumbs::-webkit-scrollbar{ display:none; }
  .tomato-thumbs.dragging{ cursor:url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgdmlld0JveD0iMCAwIDQwIDQwIj4KPGNpcmNsZSBjeD0iMjAiIGN5PSIyMCIgcj0iMTgiIGZpbGw9IiNCODE1MUIiIHN0cm9rZT0iI0Y1RjFFNiIgc3Ryb2tlLXdpZHRoPSIyIi8+CjxwYXRoIGQ9Ik0xMyAyMGgxNE0xMyAyMGw0LTRNMTMgMjBsNCA0TTI3IDIwbC00LTRNMjcgMjBsLTQgNCIgc3Ryb2tlPSIjRjVGMUU2IiBzdHJva2Utd2lkdGg9IjMiIGZpbGw9Im5vbmUiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPgo8L3N2Zz4=') 20 20, grabbing; scroll-snap-type:none; }
  .tomato-thumb{ flex:0 0 auto; display:block; height:114px; width:auto; border-radius:6px; overflow:hidden; background:var(--card); border:1px solid rgba(245,241,230,0.2); }
  .tomato-thumb img{ height:100%; width:auto; max-width:none; display:block; object-fit:cover; transition:transform .4s ease, opacity .2s ease; }
  .tomato-thumb:hover img{ transform:scale(1.03); opacity:0.9; }
  .tomato-thumbs-wrap{ position:relative; }
  .tomato-thumbs-wrap.has-arrows .tomato-thumbs{ scroll-behavior:smooth; }
  .row-arrow{ position:absolute; top:50%; transform:translateY(-50%); width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(11,10,8,0.55); border:1px solid rgba(245,241,230,0.35); color:var(--highlight); font-size:16px; line-height:1; cursor:pointer; transition:background .2s ease, border-color .2s ease; z-index:5; }
  .row-arrow:hover{ background:rgba(11,10,8,0.85); border-color:var(--highlight); }
  .row-arrow-prev{ left:-8px; }
  .row-arrow-next{ right:-8px; }

    hero: {
      headline: 'David Lloyd Design',

    heroVisual: { image:'portrait_battersea', video:null, videoPoster:'home_hero_video_poster', slideshow:['portrait_battersea','art_bluecircles','art_fireescape','art_redglow','art_spider'] },
    about: {
      quote: 'A decade shaping magazines in London, then two more making complex information look effortless and helping businesses large and small look their best.',
      bio: 'David Lloyd spent close to a decade in art direction and design for magazines in London before opening David Lloyd Design (DLD) in Sydney in 2008. In the years since, his client list has grown to include United Nations agencies, the World Bank, Deloitte and Australian Government departments — including Defence, Health and the Australian Taxation Office — turning dense reports, data and policy into visually appealing material people actually want to read. That work has secured contracts in South Sudan, Kenya, Nigeria, Sierra Leone, Myanmar, Somalia and the Pacific. David now has over 30 years behind the screen — always guided by the same standards: be a team member first and get the product right in the most creative way possible.',
      achievementsText: 'As well as running DLD, David held a UN Long-Term Agreement (LTA) contract for eight consecutive years (2009\u20132018) and a World Bank Short-Term Consultant (STC) agreement for seven years and counting (2019\u2013present). He has also spent nine years with Deloitte\u2019s Human Capital Division delivering more than $30 million in initiatives, picked up a World Bank team award for the COVID-19 vaccine response, was highly commended in 2005 and runner-up in 2006 for the Professional Publishers Association\u2019s Designer of the Year, and teaches Adobe Photoshop as a lecturer alongside his work as an underwater photographer.'
    },
    services: [
      {title:'Report & publication design', desc:'End-to-end design for strategy reports, annual reports and studies — from cover concept to a press-ready, multi-chapter layout system.'},
      {title:'Brand & identity', desc:'Logo systems and visual identity for programmes, institutes and initiatives that need to look credible from day one.'},
      {title:'Data visualisation & infographics', desc:'Storytelling with bespoke infographics and charts stakeholders can engage with, quickly and effectively.'},
      {title:'Advertising & event collateral', desc:'Banners, posters, signage and campaign artwork for conferences, launches and public events. Copywriting and editing.'},
      {title:'Knowledge and training products', desc:'Material for training curricula and modules, workforce education and staff engagement. Bespoke designs or compliant with existing brand guidelines.'}
    ],
    testimonials: [
      {quote:'David took a 40-page technical report that nobody was going to read cover to cover and turned it into something our board actually enjoyed opening. He has a rare talent for making dense material feel light.', name:'Sarah Kintu', role:'Communications Lead, UNDP South Sudan'},
      {quote:'Fast, easy to brief, and the first drafts are usually better than what we asked for.', name:'Michael Ondiek', role:'Programme Officer, Global Financing Facility'},
      {quote:'We came to David with a genuinely difficult brief — a sustainability strategy that needed to satisfy investors, regulators and our own staff all at once, in a format that wouldn’t date within a year. He pushed back on a few of our early ideas in exactly the right way, kept the whole project moving without ever feeling rushed, and the finished report has become the template every other document in the company is now measured against.', name:'Ella Novak', role:'Head of Sustainability, Descycle'},
      {quote:'Responsive, professional, and genuinely good under deadline pressure.', name:'Grace Achieng', role:'Deputy Director, Ministry of Finance and Planning'},
      {quote:'What stood out was how much David cared about the reader, not just the client. Every layout decision was about whether a busy policymaker would actually get the point in the first thirty seconds. That sounds obvious but almost nobody designing donor reports actually does it.', name:'Thomas Reid', role:'Senior Economist, World Bank'}
    ],

      '</div></section>'
    );
  }

  function aboutPageHTML(s){
    var achievementsHTML = s.about.achievementsText ? ('<span class="achievements-head">Achievements</span><p class="achievements-text reveal">'+esc(s.about.achievementsText)+'</p>') : '';
    return (
      '<section class="page-section" id="about"><div class="wrap">' +
        '<div class="section-head reveal"><span class="eyebrow">About</span></div>' +
        '<div class="about-layout">' +
          '<div class="about-content">' +
            '<p class="about-quote reveal">'+esc(s.about.quote)+'</p>' +
            '<div class="about-body">' +
              '<div class="bio reveal"><p>'+esc(s.about.bio)+'</p>'+achievementsHTML+'</div>' +
            '</div>' +
          '</div>' +
          '<div class="about-mark reveal"><img src="'+esc(s.brand.logoDataUrl)+'" alt="'+esc(s.brand.name)+' mark"></div>' +
        '</div>' +
        testimonialsHTML(s, false) +
      '</div></section>'
    );
  }

  function servicesPageHTML(s){
    var servicesHTML = s.services.map(function(row,i){ return serviceRowHTML(row,i,false); }).join('');
    return (
      '<section class="page-section" id="services"><div class="wrap">' +
        '<div class="section-head reveal"><span class="eyebrow">Services</span></div>' +
        '<div class="reveal">'+servicesHTML+'</div>' +
      '</div></section>'
    );
  }

  function contactPageHTML(s){
    return '<div class="contact-page">' + colophonHTML(s, false) + '</div>';
  }

  function getRoute(){
    var h = window.location.hash || '';
    var m = /^#project=(.+)$/.exec(h);
    if(m) return { type:'project', id: decodeURIComponent(m[1]) };
    var name = h.replace(/^#/, '') || 'home';
    if(name === 'branding'){ activeFilter = 'Brand design'; name = 'work'; }
    var valid = ['home','work','about','services','contact'];
    if(valid.indexOf(name) === -1) name = 'home';
    return { type:'page', name:name };
  }

  function pageShellHTML(routeName){
    var s = state;
    var content;
    if(routeName === 'work') content = workPageHTML(s, activeFilter);
    else if(routeName === 'about') content = aboutPageHTML(s);
    else if(routeName === 'services') content = servicesPageHTML(s);
    else if(routeName === 'contact') content = contactPageHTML(s);
    else content = homePageHTML(s);
    return (
      sidebarHTML(routeName) +
      '<main class="page-main">' + content + '</main>' +
      '<div class="toast" id="toast"></div>'
    );
  }

  function serviceRowHTML(s, i, editing){
    var idx = String(i+1).padStart(2,'0');
    return (
      '<div class="service-row" data-id="'+esc(s.id||genId())+'">' +
        '<div class="service-idx">'+idx+'</div>' +
        '<div>' +
          '<h3'+ce(editing)+' data-role="title">'+esc(s.title)+'</h3>' +
          '<div class="desc-cell"'+ce(editing)+' data-role="desc">'+esc(s.desc)+'</div>' +
        '</div>' +
        (editing ? '<button type="button" class="row-remove" data-action="remove-service">Remove</button>' : '<span></span>') +
      '</div>'
    );
  }

  function testimonialRowHTML(t, editing){
    return (
      '<div class="testimonial-row" data-id="'+esc(t.id||genId())+'">' +
        '<p class="testimonial-quote"'+ce(editing)+' data-role="t-quote">'+esc(t.quote)+'</p>' +
        '<div class="testimonial-foot">' +
          '<span class="testimonial-name"'+ce(editing)+' data-role="t-name">'+esc(t.name)+'</span>' +
          '<span class="testimonial-role"'+ce(editing)+' data-role="t-role">'+esc(t.role)+'</span>' +
        '</div>' +
        (editing ? '<button type="button" class="row-remove" data-action="remove-testimonial">Remove</button>' : '') +
      '</div>'
    );
  }

  function testimonialsHTML(s, editing){
    var list = s.testimonials || [];
    if(!editing && !list.length) return '';
    var rowsHTML = list.map(function(t){ return testimonialRowHTML(t, editing); }).join('');
    return (
      '<div class="testimonials">' +
        '<span class="testimonials-head">What clients say</span>' +
        '<div class="testimonials-grid" data-role="testimonials-list">'+rowsHTML+'</div>' +
        (editing ? '<button type="button" class="add-row" data-action="add-testimonial">+ Add testimonial</button>' : '') +
      '</div>'
    );
  }

  function bodyHTML(state, editing, activeFilter){
    var s = state;
    var filter = activeFilter || 'All';
    var chipsHTML = filterChipsHTML(s.projects, filter);
    var cardsHTML = s.projects.map(function(p,i){
      var card = projectCardHTML(p,i,editing);
      if(filter !== 'All' && p.group !== filter){
        card = card.replace('class="work-card reveal"', 'class="work-card reveal" hidden');
      }
      return card;
    }).join('');
    var addPanel = editing ? '<div class="add-panel-row"><button type="button" class="add-panel" data-action="add-project">+ Add project</button></div>' : '';

    var servicesHTML = s.services.map(function(row,i){ return serviceRowHTML(row,i,editing); }).join('');

    var achievementsHTML = editing
      ? '<div><span class="field-label">Achievements</span><div class="field-edit" contenteditable="true" data-role="achievements">'+esc(s.about.achievementsText||'')+'</div></div>'
      : (s.about.achievementsText ? ('<span class="achievements-head">Achievements</span><p class="achievements-text reveal">'+esc(s.about.achievementsText)+'</p>') : '');

    var editBar = editing
      ? (
        '<div class="edit-bar"><div class="wrap edit-bar-inner">' +
          '<span class="msg" id="edit-msg">Editing — changes go live for every visitor once sent to press.</span>' +
          '<span class="actions">' +
            '<button type="button" class="btn btn-ghost" data-action="cancel">Discard</button>' +
            '<button type="button" class="btn btn-primary" id="save-btn" data-action="save">Send to press &rarr;</button>' +
          '</span>' +
        '</div></div>'
      )
      : '';

    return (
      sidebarHTML('') +
      '<main class="page-main">' +

      '<header class="hero hero-tomato hero-page" id="top">' +
        '<div class="hero-tomato-bg">' + heroBgHTML(s, false) + '</div>' +
        '<div class="hero-tomato-veil"></div>' +
        '<div class="hero-tomato-content wrap">' +
          '<div class="hero-tomato-top">' +
            '<span class="eyebrow">Graphic designer and consultant</span>' +
            '<h1 class="display hero-tomato-h1"'+ce(editing)+' data-role="headline">'+esc(s.hero.headline)+'</h1>' +
            '<nav class="hero-categories">' + heroCategoriesHTML(s.projects) + '</nav>' +
          '</div>' +
          '<div class="hero-tomato-bottom">' +
            '<div class="hero-tomato-bottom-left">' +
              '<p class="hero-tomato-sub"'+ce(editing)+' data-role="sub">'+esc(s.hero.sub)+'</p>' +
              testimonialSliderHTML(s, heroTestiIndex) +
            '</div>' +
            '<a class="hero-cta" href="#work">See the work &rarr;</a>' +
          '</div>' +
        '</div>' +
      '</header>' +

      '<section id="work"><div class="wrap">' +
        '<div class="section-head reveal"><span class="eyebrow">Selected work</span><h2 class="display">A few real projects</h2></div>' +
        chipsHTML +
        '<div class="work-grid">' + cardsHTML + addPanel + '</div>' +
      '</div></section>' +

      brandingHTML() +

      '<section id="about"><div class="wrap">' +
        '<div class="section-head reveal"><span class="eyebrow">About</span></div>' +
        '<div class="about-layout">' +
          '<div class="about-content">' +
            '<p class="about-quote reveal"'+ce(editing)+' data-role="quote">'+esc(s.about.quote)+'</p>' +
            '<div class="about-body">' +
              '<div class="bio reveal"><p'+ce(editing)+' data-role="bio">'+esc(s.about.bio)+'</p>'+achievementsHTML+'</div>' +
            '</div>' +
          '</div>' +
          '<div class="about-mark reveal"><img src="'+esc(s.brand.logoDataUrl)+'" alt="'+esc(s.brand.name)+' mark"></div>' +
        '</div>' +
        testimonialsHTML(s, editing) +
      '</div></section>' +

      '<section id="services"><div class="wrap">' +
        '<div class="section-head reveal"><span class="eyebrow">Services</span></div>' +
        '<div class="reveal" data-role="services-list">'+servicesHTML+'</div>' +
        (editing ? '<button type="button" class="add-row" data-action="add-service">+ Add service</button>' : '') +
      '</div></section>' +

      colophonHTML(s, editing) +

      editBar +
      '</main>' +
      '<div class="toast" id="toast"></div>'
    );
  }

  function fullDocumentString(state){
    return '<!doctype html>\n<html lang="en">\n<head>\n' + HEAD_HTML + '\n</head>\n<body>\n<div id="app">' +
      bodyHTML(state, false, 'All') + '</div>\n<script>' + SELF_SRC + '<' + '/script>\n</body>\n</html>';
  }

  var editModeAllowed = true; // always show 'Edit site' — this is the owner's private working link

  var state = DEFAULT_STATE;
  var heroTestiIndex = 0;
  var editing = false;
  var canWrite = true;
  var activeFilter = 'All';
  var io = null;

  function setupReveal(){
    var items = document.querySelectorAll('.reveal:not(.in)');
    if(!('IntersectionObserver' in window)){
      items.forEach(function(el){ el.classList.add('in'); });
      return;
    }
    if(io) io.disconnect();
    io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add('in');
          io.unobserve(entry.target);
        }
      });
    }, { threshold:0.1, rootMargin:'0px 0px -6% 0px' });
    items.forEach(function(el){ io.observe(el); });
  }

  function setupGallery(){
    var gal = document.querySelector('.detail-gallery');
    if(!gal) return;
    var counter = document.querySelector('[data-role="gallery-counter"]');
    var total = gal.querySelectorAll('.detail-slide').length;
    if(!counter || total < 2) return;
    function update(){
      var idx = Math.round(gal.scrollLeft / Math.max(1, gal.clientWidth));
      idx = Math.max(0, Math.min(total - 1, idx));
      counter.textContent = String(idx + 1).padStart(2, '0') + ' / ' + String(total).padStart(2, '0');
    }
    gal.addEventListener('scroll', function(){
      clearTimeout(gal._scrollT);
      gal._scrollT = setTimeout(update, 90);
    });
    update();
  }

  function setupThumbDrag(){
    var rows = document.querySelectorAll('.tomato-thumbs');
    rows.forEach(function(row){
      if(row._dragBound) return;
      row._dragBound = true;
      var isDown = false, startX = 0, startScroll = 0, moved = false;
      function onMove(e){
        if(!isDown) return;
        var dx = e.clientX - startX;
        if(Math.abs(dx) > 3) moved = true;
        row.scrollLeft = startScroll - dx;
      }
      function onUp(){
        if(!isDown) return;
        isDown = false;
        row.classList.remove('dragging');
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        if(moved){
          var suppress = function(ev){ ev.preventDefault(); ev.stopPropagation(); row.removeEventListener('click', suppress, true); };
          row.addEventListener('click', suppress, true);
        }
      }
      row.addEventListener('pointerdown', function(e){
        if(e.pointerType === 'touch') return;
        isDown = true; moved = false;
        startX = e.clientX; startScroll = row.scrollLeft;
        row.classList.add('dragging');
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      });
    });
  }

  function render(){
    var app = document.getElementById('app');

    if(editing){
      app.innerHTML = bodyHTML(state, true, activeFilter);
      setupReveal();
      setupGallery();
      setupThumbDrag();
      return;
    }

    var route = getRoute();
    if(route.type === 'project'){
      var proj = (state.projects||[]).filter(function(pp){ return pp.id === route.id; })[0];
      if(proj){
        app.innerHTML = projectDetailHTML(state, proj);
        window.scrollTo(0,0);
        setupReveal();
        setupGallery();
        setupThumbDrag();
        return;
      }
      history.replaceState(null, '', window.location.pathname + window.location.search + '#work');
      route = { type:'page', name:'work' };
    }

    app.innerHTML = pageShellHTML(route.name);
    window.scrollTo(0,0);
    setupReveal();
    setupGallery();
    setupThumbDrag();
  }

  function showToast(msg, ms){
    var t = document.getElementById('toast');
    if(!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ t.classList.remove('show'); }, ms || 3200);
  }

  function extractState(){
    var app = document.getElementById('app');
    var get = function(role){ var el = app.querySelector('[data-role="'+role+'"]'); return el ? el.innerText.trim() : ''; };

    var achievementsText = get('achievements');

    var projects = Array.prototype.map.call(app.querySelectorAll('.work-card'), function(item){
      var tagsRaw = ((item.querySelector('[data-role="tags"]') || {}).innerText || '').trim();
      var tags = tagsRaw ? tagsRaw.split(',').map(function(x){ return x.trim(); }).filter(Boolean) : (function(){
        var chips = item.querySelectorAll('.work-tag');
        return Array.prototype.map.call(chips, function(c){ return c.innerText.trim(); }).filter(Boolean);
      })();
      return {
        id: item.getAttribute('data-id') || genId(),
        image: item.getAttribute('data-image') || '',
        pos: item.getAttribute('data-pos') || 'center center',
        group: item.getAttribute('data-group') || '',
        title: ((item.querySelector('[data-role="title"]') || {}).innerText || '').trim(),
        meta: ((item.querySelector('[data-role="meta"]') || {}).innerText || '').trim(),
        desc: ((item.querySelector('[data-role="desc"]') || {}).innerText || '').trim(),
        tags: tags
      };
    });

    var services = Array.prototype.map.call(app.querySelectorAll('[data-role="services-list"] .service-row'), function(row){
      return {
        id: row.getAttribute('data-id') || genId(),
        title: ((row.querySelector('[data-role="title"]') || {}).innerText || '').trim(),
        desc: ((row.querySelector('[data-role="desc"]') || {}).innerText || '').trim()
      };
    });

    var testimonials = Array.prototype.map.call(app.querySelectorAll('[data-role="testimonials-list"] .testimonial-row'), function(row){
      return {
        id: row.getAttribute('data-id') || genId(),
        quote: ((row.querySelector('[data-role="t-quote"]') || {}).innerText || '').trim(),
        name: ((row.querySelector('[data-role="t-name"]') || {}).innerText || '').trim(),
        role: ((row.querySelector('[data-role="t-role"]') || {}).innerText || '').trim()
      };
    });

    return {
      brand: { name: state.brand.name, short: state.brand.short, logoDataUrl: state.brand.logoDataUrl },
      hero: { headline: get('headline'), sub: get('sub'), regions: get('regions') },
      heroVisual: { image: state.heroVisual.image, video: state.heroVisual.video, videoPoster: state.heroVisual.videoPoster, slideshow: state.heroVisual.slideshow },
      about: { quote: get('quote'), bio: get('bio'), achievementsText: achievementsText },
      services: services,
      testimonials: testimonials,
      projects: projects,
      contact: {
        email: get('email'),
        location: get('location'),
        instagram: get('instagram'),
        availability: get('availability')
      }
    };
  }

  function enterEdit(){
    if(!editModeAllowed) return;
    editing = true;
    render();
  }
  function cancelEdit(){ editing = false; render(); showToast('Changes discarded.'); }

  function saveEdit(){
    var newState = extractState();
    if(!newState.hero.headline || !newState.brand.short){
      showToast('Headline can’t be empty.');
      return;
    }
    var btn = document.getElementById('save-btn');
    var msg = document.getElementById('edit-msg');
    if(btn){ btn.disabled = true; btn.textContent = 'Sending…'; }
    if(msg){ msg.textContent = 'Publishing your changes…'; }

    if(!(window.claude && typeof window.claude.use === 'function')){
      showToast('Editing isn’t available in this preview. Open the published page to edit.');
      if(btn){ btn.disabled = false; btn.textContent = 'Send to press →'; }
      if(msg){ msg.textContent = 'Editing — changes go live for every visitor once sent to press.'; }
      return;
    }

    window.claude.use('artifact').then(function(artifact){
      if(!artifact){ throw { code:'capability_disabled', message:'Editing capability unavailable here.' }; }
      var html = fullDocumentString(newState);
      return artifact.publish(html);
    }).then(function(){
      state = newState;
      editing = false;
      render();
      showToast('Saved and published.');
    }).catch(function(err){
      var code = err && err.code;
      if(code === 'not_writer' || code === 'not_granted' || code === 'consent_required'){
        canWrite = false;
        showToast('You’re viewing a read-only copy of this page.');
        editing = false;
        render();
        return;
      }
      if(code === 'conflict'){
        showToast('This page changed elsewhere — refreshing with the latest version…');
        return;
      }
      if(code === 'too_large'){
        showToast('That’s too much content to save at once — try trimming it down.');
      } else {
        showToast('Couldn’t save right now. Please try again in a moment.');
      }
      if(btn){ btn.disabled = false; btn.textContent = 'Send to press →'; }
      if(msg){ msg.textContent = 'Editing — changes go live for every visitor once sent to press.'; }
    });
  }

  document.addEventListener('submit', function(e){
    var form = e.target.closest('#enquiry-form');
    if(!form) return;
    e.preventDefault();
    var name = (form.querySelector('[name="name"]').value || '').trim();
    var fromEmail = (form.querySelector('[name="email"]').value || '').trim();
    var type = form.querySelector('[name="type"]').value;
    var message = (form.querySelector('[name="message"]').value || '').trim();
    if(!name || !fromEmail || !message){
      showToast('Please fill in your name, email and a short message.');
      return;
    }
    var to = (state.contact && state.contact.email) || 'dave@dld.net.au';
    var subject = 'Project enquiry — ' + type + ' (' + name + ')';
    var body = 'Name: ' + name + '\nEmail: ' + fromEmail + '\nProject type: ' + type + '\n\n' + message;
    window.location.href = 'mailto:' + to + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
    showToast('Opening your email app to send this enquiry…');
  });

  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.getAttribute('data-action');

    if(action === 'enter-edit'){ if(canWrite) enterEdit(); else showToast('This page is read-only for you.'); }
    else if(action === 'cancel'){ cancelEdit(); }
    else if(action === 'save'){ saveEdit(); }

    else if(action === 'filter'){
      activeFilter = el.getAttribute('data-group') || 'All';
      render();
    }

    else if(action === 'back-to-work'){
      window.location.hash = 'work';
    }

    else if(action === 'gallery-prev' || action === 'gallery-next'){
      var gal = document.querySelector('.detail-gallery');
      if(gal){
        var dir = action === 'gallery-next' ? 1 : -1;
        gal.scrollBy({ left: dir * gal.clientWidth, behavior: 'smooth' });
      }
    }

    else if(action === 'testi-prev' || action === 'testi-next'){
      var tWrap = document.querySelector('[data-role="hero-testimonial"]');
      var tList = state.testimonials || [];
      if(tWrap && tList.length){
        var tCur = parseInt(tWrap.getAttribute('data-index'), 10) || 0;
        var tDir = action === 'testi-next' ? 1 : -1;
        heroTestiIndex = ((tCur + tDir) % tList.length + tList.length) % tList.length;
        tWrap.outerHTML = testimonialSliderHTML(state, heroTestiIndex);
      }
    }

    else if(action === 'testi-expand'){
      var body = el.closest('.hero-testimonial-body');
      var q = body ? body.querySelector('[data-role="hero-testi-quote"]') : null;
      if(q){
        var isExpanded = q.classList.toggle('testi-expanded');
        q.classList.toggle('testi-clamped', !isExpanded);
        el.classList.toggle('is-expanded', isExpanded);
        el.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
        el.textContent = isExpanded ? '−' : '+';
      }
    }

    else if(action === 'thumbs-prev' || action === 'thumbs-next'){
      var rowWrap = el.closest('.tomato-row');
      var thumbs = rowWrap ? rowWrap.querySelector('.tomato-thumbs') : null;
      if(thumbs){
        var tdir = action === 'thumbs-next' ? 1 : -1;
        thumbs.scrollBy({ left: tdir * thumbs.clientWidth * 0.8, behavior: 'smooth' });
      }
    }

    else if(action === 'home-filter'){
      activeFilter = el.getAttribute('data-group') || 'All';
      window.location.hash = 'work';
    }

    else if(action === 'toggle-menu'){
      var menu = document.getElementById('side-menu');
      if(menu) menu.classList.toggle('open');
    }

    else if(action === 'nav-link'){
      var openMenu = document.getElementById('side-menu');
      if(openMenu) openMenu.classList.remove('open');
    }

    else if(action === 'add-project'){
      var count = document.querySelectorAll('.work-card').length;
      var newProject = {
        id: genId(), title:'New project', meta:'Client — Year',
        desc:'Short description of the work — replace with real detail.',
        tags:['Category'], group:'', image:'', pos:'center center'
      };
      var addRow = document.querySelector('.add-panel-row');
      var html = projectCardHTML(newProject, count, true);
      if(addRow){ addRow.insertAdjacentHTML('beforebegin', html); }
      setupReveal();
    }
    else if(action === 'remove-project'){
      var allItems = document.querySelectorAll('.work-card');
      if(allItems.length <= 1){ showToast('Keep at least one project.'); return; }
      var item = e.target.closest('.work-card');
      if(item) item.remove();
    }

    else if(action === 'add-service'){
      var list = document.querySelector('[data-role="services-list"]');
      var count2 = list.querySelectorAll('.service-row').length;
      var newRow = { id: genId(), title:'New service', desc:'Short description of this service.' };
      list.insertAdjacentHTML('beforeend', serviceRowHTML(newRow, count2, true));
    }
    else if(action === 'remove-service'){
      var rows = document.querySelectorAll('[data-role="services-list"] .service-row');
      if(rows.length <= 1){ showToast('Keep at least one service.'); return; }
      var row = e.target.closest('.service-row');
      if(row) row.remove();
    }

    else if(action === 'add-testimonial'){
      var tList = document.querySelector('[data-role="testimonials-list"]');
      var newTestimonial = { id: genId(), quote:'What this client said about working with David.', name:'Client name', role:'Role, Organisation' };
      tList.insertAdjacentHTML('beforeend', testimonialRowHTML(newTestimonial, true));
    }
    else if(action === 'remove-testimonial'){
      var tRow = e.target.closest('.testimonial-row');
      if(tRow) tRow.remove();
    }
  });

  window.addEventListener('hashchange', function(){ if(!editing) render(); });

  render();
})();
</script>
